<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Монобанк — Игрок</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Монобанк">
  <meta name="theme-color" content="#21a038">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
      <!-- Фиксированная шапка -->
  <div class="fixed-header">
    <h1>Монобанк 🏦</h1>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="app">
    <!-- Карточка баланса -->
    <div class="card balance-card" id="mainBalanceCard">
      <div class="balance-inner">
        <div class="balance-avatar" id="myAvatar">🐱</div>
        <div class="balance-label">Твой баланс</div>
        <div class="balance-amount"><span id="myBalance">0</span> <span class="cur">₽</span></div>
      </div>
    </div>
    <!-- Остальной код (кнопки, история и т.д.) остается без изменений -->

    <button class="btn" onclick="openTransferModal()" style="margin-bottom:24px;">💸 Перевести деньги</button>

    <div id="tabHistoryContent">
      <div class="card">
        <h3 style="margin-bottom:12px; font-size:16px;">История операций</h3>
        <div id="historyList"><div class="empty">Пока нет операций</div></div>
      </div>
    </div>

    <div id="tabPlayersContent" style="display:none;">
      <div class="card">
        <h3 style="margin-bottom:12px; font-size:16px;">Игроки в комнате</h3>
        <div id="playersList"><div class="empty">Загрузка...</div></div>
      </div>
    </div>

    <div id="tabSettingsContent" style="display:none;">
      <div class="card" style="text-align:center; padding:30px;">
        <div style="font-size:48px; margin-bottom:16px;">⚙️</div>
        <h3>Настройки</h3>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Твой ID: <span id="sessionPlayerId"></span></p>
        <button class="btn secondary" onclick="logout()" style="color:var(--danger); border-color:var(--danger);">Выйти из комнаты</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="navHistory" onclick="switchTab('history')">
      <span class="nav-icon">📋</span> Операции
    </div>
    <div class="nav-item" id="navPlayers" onclick="switchTab('players')">
      <span class="nav-icon">👥</span> Игроки
    </div>
    <div class="nav-item" id="navSettings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span> Настройки
    </div>
  </div>

  <div class="modal-overlay" id="transferModal" style="display:none;">
    <div class="modal">
      <h3 style="margin-bottom:16px;">Перевод</h3>
      <div class="field">
        <label>Кому перевести?</label>
        <select id="transferTarget" style="width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:16px;"></select>
      </div>
      <div class="field">
        <label>Сумма</label>
        <input type="number" id="transferAmount" placeholder="0" min="1" inputmode="numeric">
      </div>
      <div class="field">
        <label>Комментарий (необязательно)</label>
        <input type="text" id="transferComment" placeholder="Например: Аренда" maxlength="50">
        <div class="quick-replies">
          <div class="quick-reply" onclick="setComment('Аренда')">Аренда</div>
          <div class="quick-reply" onclick="setComment('Штраф')">Штраф</div>
          <div class="quick-reply" onclick="setComment('Зарплата')">Зарплата</div>
          <div class="quick-reply" onclick="setComment('Долг')">Долг</div>
          <div class="quick-reply" onclick="setComment('Спасибо')">Спасибо</div>
        </div>
      </div>
      <button class="btn" onclick="submitTransfer()">Перевести</button>
      <button class="btn secondary" onclick="closeTransferModal()">Отмена</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/player.js?v=9"></script>
<script>
  let ticking = false;
  const card = document.getElementById('mainBalanceCard');
  const avatar = card.querySelector('.balance-avatar');
  const amount = card.querySelector('.balance-amount');
  
  const maxScroll = 150; // Скорость сжатия
  const startTop = 75;
  const endTop = 75;

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(() => {
        if (card) {
          const scrollY = window.scrollY;
          
          if (scrollY <= 0) {
            // Изначальное состояние (большая)
            card.classList.remove('compact');
            card.style.height = '270px';
            card.style.top = `${startTop}px`;
            
            avatar.style.fontSize = '52px';
            avatar.style.transform = 'translate(-50%, -50%)';
            avatar.style.marginTop = '-40px';
            
            amount.style.fontSize = '48px';
            amount.style.transform = 'translate(-50%, -50%)';
            amount.style.marginTop = '35px';
            
          } 
          else if (scrollY < maxScroll) {
            const progress = scrollY / maxScroll; 
            
            card.style.height = `${270 - (190 * progress)}px`; // Плавно до 80px
            card.style.top = `${startTop - (5 * progress)}px`;
            
            avatar.style.fontSize = `${52 - (26 * progress)}px`;
            amount.style.fontSize = `${48 - (24 * progress)}px`;
            
            const shift = progress * 110; 
            
            avatar.style.marginTop = `${-40 + (40 * progress)}px`;
            amount.style.marginTop = `${35 - (35 * progress)}px`;
            
            avatar.style.transform = `translate(calc(-50% - ${shift}px), -50%)`;
            amount.style.transform = `translate(calc(-50% + ${shift}px), -50%)`;
            
          } else {
            // Конечное состояние (маленькая)
            card.classList.add('compact');
            card.style.height = '80px'; 
            card.style.top = `${endTop}px`;
            
            avatar.style.fontSize = '26px';
            avatar.style.marginTop = '0px';
            avatar.style.transform = 'translate(calc(-50% - 110px), -50%)';
            
            amount.style.fontSize = '24px';
            amount.style.marginTop = '0px';
            amount.style.transform = 'translate(calc(-50% + 110px), -50%)';
          }
        }
        ticking = false;
      });
      ticking = true;
    }
  });
</script>
</body>
</html>
